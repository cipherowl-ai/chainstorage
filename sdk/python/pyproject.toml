[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chainstorage-sdk"
description = "Python SDK for ChainStorage"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    # The generated classes under src/coinbase set these bounds: they are
    # emitted by grpcio-tools 1.71.0 as protobuf 5.29.0 code, which runs on
    # the protobuf 5 and 6 runtimes only.
    "grpcio>=1.71.0",
    "protobuf>=5.29.0,<7",
    "requests>=2.31",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    # Pinned: scripts/protogen-py.sh refuses any other version, and CI fails
    # when the generated classes differ from what this version emits.
    "grpcio-tools==1.71.0",
    "pytest>=8",
    # Pinned so that `ruff format --check` gives the same answer everywhere.
    "ruff==0.17.5",
]

[tool.setuptools.dynamic]
version = { attr = "chainstorage_sdk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
chainstorage_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Generated by scripts/protogen-py.sh; never edited or formatted by hand.
extend-exclude = ["src/coinbase"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Both live under src/. Naming them keeps import order independent of where
# ruff is run from.
known-first-party = ["chainstorage_sdk", "coinbase"]
